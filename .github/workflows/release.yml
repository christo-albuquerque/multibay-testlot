name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create (default v0.1.<run number>)
        type: string
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" dist/manifest.json
          else
            tag="${INPUT_TAG:-v0.1.$RUN_NUMBER}"
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag" dist/manifest.json
          fi
